<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Cloud & Primary Symbol Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Film & Play Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Inner Glow for Squircle -->
    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base with Glow -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bgGrad)" filter="url(#innerShadow)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="6" />

  <!-- Subtle Film Holes Top & Bottom Pattern inside container -->
  <g opacity="0.15" fill="#ffffff">
    <rect x="80" y="56" width="32" height="20" rx="4" />
    <rect x="136" y="56" width="32" height="20" rx="4" />
    <rect x="192" y="56" width="32" height="20" rx="4" />
    <rect x="248" y="56" width="32" height="20" rx="4" />
    <rect x="304" y="56" width="32" height="20" rx="4" />
    <rect x="360" y="56" width="32" height="20" rx="4" />

    <rect x="80" y="436" width="32" height="20" rx="4" />
    <rect x="136" y="436" width="32" height="20" rx="4" />
    <rect x="192" y="436" width="32" height="20" rx="4" />
    <rect x="248" y="436" width="32" height="20" rx="4" />
    <rect x="304" y="436" width="32" height="20" rx="4" />
    <rect x="360" y="436" width="32" height="20" rx="4" />
  </g>

  <!-- Modern Cloud Netdisk Body (Baidu Cloud + Telegram Transfer) -->
  <path d="M176 348 C132 348 96 312 96 268 C96 228 126 195 165 189 C178 135 227 96 286 96 C351 96 405 144 414 207 C447 218 472 249 472 286 C472 328 438 362 396 362 L176 362 Z"
        fill="url(#primaryGrad)"
        opacity="0.3"
        filter="url(#glow)" />

  <path d="M166 332 C128 332 98 302 98 264 C98 229 124 200 159 195 C170 148 212 114 263 114 C320 114 366 156 374 211 C403 220 424 247 424 280 C424 316 394 346 358 346 L166 346 Z"
        fill="none"
        stroke="url(#primaryGrad)"
        stroke-width="14"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.8" />

  <!-- Cinema Clapperboard / Film Reel Motif in Center -->
  <!-- Clapper Top Bar -->
  <g transform="translate(155, 175)">
    <!-- Film Reel & Play Sync Centerpiece -->
    <path d="M42 20 L160 20 C172 20 182 30 182 42 L182 136 C182 148 172 158 160 158 L42 158 C30 158 20 148 20 136 L20 42 C20 30 30 20 42 20 Z"
          fill="#090d16"
          stroke="url(#accentGrad)"
          stroke-width="10"
          rx="24"
          filter="url(#innerShadow)" />

    <!-- Clapper Stripe Accents -->
    <path d="M30 46 L58 20 M74 54 L102 20 M118 54 L146 20 M162 54 L180 36"
          stroke="#38bdf8"
          stroke-width="8"
          stroke-linecap="round"
          opacity="0.7" />

    <line x1="20" y1="54" x2="182" y2="54" stroke="rgba(56, 189, 248, 0.4)" stroke-width="4" />

    <!-- Futuristic Glowing Play & Fast-Forward / Transfer Arrow -->
    <polygon points="80,74 136,106 80,138" fill="url(#accentGrad)" filter="url(#glow)" />
    <polygon points="80,74 136,106 80,138" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Telegram Paper Airplane Wing Accent (Top Right) -->
  <g transform="translate(310, 110) scale(0.65)" filter="url(#glow)">
    <path d="M140 10 L15 85 L70 110 L120 45 L85 115 L125 145 Z"
          fill="url(#accentGrad)"
          stroke="#ffffff"
          stroke-width="3"
          stroke-linejoin="round" />
  </g>

  <!-- Bottom Glowing Transfer Nodes / Star Sparkle -->
  <circle cx="210" cy="400" r="5" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="256" cy="410" r="8" fill="#818cf8" filter="url(#glow)" />
  <circle cx="302" cy="400" r="5" fill="#c084fc" filter="url(#glow)" />
  <line x1="170" y1="400" x2="342" y2="400" stroke="url(#accentGrad)" stroke-width="4" stroke-dasharray="8 8" opacity="0.6" />
</svg>
